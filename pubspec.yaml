name: housepital_patient
description: "Housepital Patient & Family App - Hospital-like expertise, Home-like care"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^15.1.2

  # State Management
  provider: ^6.1.4

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.6.8

  # Networking
  http: ^1.4.0
  dio: ^5.8.0+1

  # Local Storage
  shared_preferences: ^2.5.3

  # UI Components
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0

  # Payments
  razorpay_flutter: ^1.3.7

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/i18n/
    - assets/equipment_catalog.json
    - assets/lab_tests_catalog.json

  # Archivo font loaded via google_fonts package at runtime
